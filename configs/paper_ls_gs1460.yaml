paths:
  librispeech_root: data/dma-kws/raw/LibriSpeech
  libriphrase460_root: data/dma-kws/raw/LibriPhrase-460
  gigaphrase1000_root: data/dma-kws/raw/GigaPhrase-1000
  processed_root: data/dma-kws/processed
  feature_root: data/dma-kws/features
  exp_root: data/dma-kws/exp

tokenizer:
  dict_path: data/dict/lang_char.txt
  split_with_space: " "

training:
  seed: 2025
  recipe: ft-ls-gs-1460

stage1:
  train_splits:
    - train-clean-460
  dev_splits:
    - dev-clean
  sample_rate: 16000
  input_dim: 80
  encoder_output_dim: 144
  attention_heads: 4
  linear_units: 576
  num_blocks: 6
  batch_size_per_gpu: 48
  max_epochs: 30
  max_train_steps: 0
  num_workers: 4
  learning_rate: 0.001
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.0
  ctc_dropout: 0.0
  cnn_module_kernel: 3
  gradient_clip_val: 1.0
  log_interval: 10
  checkpoint_dir: data/dma-kws/exp/stage1_phoneme_ctc/checkpoints
  log_dir: data/dma-kws/exp/stage1_phoneme_ctc/logs
  run_name: stage1_phoneme_ctc
  validation:
    dev_manifest: ""
    batch_size: 48
    check_val_every_n_epoch: 1
    num_decode_batches: 0

stage2:
  prep:
    output_subdir: ls-gs-1460
  encoder_output_dim: 144
  qbyt_embed_dim: 128
  qbyt_layers: 2
  init_checkpoint: data/dma-kws/exp/stage2_qbyt/checkpoints/init-ls-460/avg_10.ckpt
  resume_checkpoint: data/dma-kws/exp/stage2_qbyt/checkpoints/init-ls-460/avg_10.ckpt
  parquet_file: data/dma-kws/processed/stage2_qbyt/ls-gs-1460/processed_data.parquet
  wav_dir: data/dma-kws/features/fbank
  negative_ratio: 1
  hard_negative_ratio: 100
  sample_lens: 100000000
  batch_size_per_gpu: 512
  max_steps: 100000
  num_workers: 16
  learning_rate: 0.0005
  warmup_steps: 2500
  total_scheduler_steps: 100000
  accumulate_grad_batches: 2
  # ---- Stage II 训练优化（均为可选项，默认保持向后兼容）----
  precision: bf16-mixed        # 安全提速；CPU 自动回退 32-true
  dataloader:
    pin_memory: true           # 锁页内存，加速 H2D 拷贝
    persistent_workers: true   # 仅在 num_workers>0 生效
    prefetch_factor: 4         # 每个 worker 预取批数；仅 num_workers>0 生效
  optimizer: adam              # adam(默认,等价现状) | adamw
  weight_decay: 0.0            # 用 adamw 时建议 0.01
  ema:
    enabled: false             # 开启后用 Lightning WeightAveraging 做权重 EMA
    decay: 0.999               # EMA 衰减系数
    start_step: 0              # 从该 step 起累计 EMA
  console:
    rich: true                 # Rich 控制台进度/参数表；未装 rich 自动回退 tqdm
    device_stats: false        # 记录设备占用到 dashboard
    throughput: false          # 记录吞吐(样本/秒)到 dashboard
  logging:
    backends: [csv, tensorboard]   # 可加 wandb / trackio
    wandb: { project: dma-kws, mode: online }   # backends 含 wandb 时生效
    trackio: { project: dma-kws }               # backends 含 trackio 时生效
  strategy: ddp
  gradient_clip_val: 1.0
  log_interval: 10
  val_check_interval: 1000
  freeze_encoder: false
  checkpoint_dir: data/dma-kws/exp/stage2_qbyt/checkpoints/ft-ls-gs-1460
  log_dir: data/dma-kws/exp/stage2_qbyt/logs/ft-ls-gs-1460
  run_name: ft-ls-gs-1460
  validation:
    batch_size: 256
    val_check_interval: 1000
  checkpoint:
    every_n_train_steps: 1000
    save_top_k: -1

demo:
  stage1_candidate_margin_sec: 0.15
  qbyt_threshold: 0.5
