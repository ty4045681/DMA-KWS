encoder_output_dim: 144
qbyt_embed_dim: 128
qbyt_layers: 2
negative_ratio: 1
learning_rate: 0.0005
warmup_steps: 2500
total_scheduler_steps: 50000
accumulate_grad_batches: 1
precision: bf16-mixed
optimizer: adam
weight_decay: 0.0
strategy: auto
find_unused_parameters: false
gradient_diagnostics:
  enabled: false
  max_steps: 5
gradient_clip_val: 1.0
log_interval: 10
val_check_interval: 1000
freeze_encoder: false

# Load QbyT weights trained before the pooled readout was fixed. Their parameter
# shapes still match, so nothing else would notice, but they were trained to read
# a different frame. Only the encoder/adapter weights survive a warm start this
# way, and no score from such a checkpoint is comparable with its original run.
allow_legacy_qbyt_readout: false

# The released code used unordered phoneme set-membership labels. The corrected
# target is cumulative ordered/contiguous progress (111...000), plus an explicit
# full-keyword completion term. For a strict legacy ablation use:
# target_mode=membership, progress_weight=1, completion_weight=0,
# normalization=token.
sequence_loss:
  target_mode: ordered_contiguous_prefix
  progress_weight: 0.5
  completion_weight: 0.5
  normalization: sample

# Phoneme-CTC trunk between the frozen encoder and QbyT (see configs/phoneme_adapter).
# Off by default so pre-adapter checkpoints keep loading and stay comparable.
phoneme_adapter:
  enabled: false
  init_checkpoint: ""
  freeze: false
  ctc_weight: 0.0
  ctc_dropout: 0.0
  expose_posterior: false
  trunk:
    type: conv
    output_dim: 192
    num_layers: 2
    kernel_size: 7
    dropout: 0.1

checkpoint_dir: ${paths.exp_root}/stage2_qbyt/checkpoints
log_dir: ${paths.exp_root}/stage2_qbyt/logs
run_name: stage2_qbyt

dataloader:
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

ema:
  enabled: false
  decay: 0.999
  start_step: 0

console:
  rich: true
  device_stats: false
  throughput: false
  refresh_rate: null
  leave: true

logging:
  backends: [csv, tensorboard]
  grad_norm: true
  wandb:
    project: dma-kws
    mode: online
  trackio:
    project: dma-kws

validation:
  batch_size: 256
  val_check_interval: 1000
  # Fixed-width bins for validation score calibration diagnostics.
  ece_num_bins: 15
  # The sequence endpoint is diagnostic-only and is not calibrated on the
  # deployed utterance-head threshold.
  seq_diagnostic_threshold: 0.5

eval:
  fbank:
    dither: 0.0
  split: hard
  aggregate_csv: evaluation_set/test_all_phrase.csv
  batch_size: 256

checkpoint:
  every_n_train_steps: 1000
  save_top_k: -1
  monitor: val_auc
  mode: max
