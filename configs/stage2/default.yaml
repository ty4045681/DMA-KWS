encoder_output_dim: 144
qbyt_embed_dim: 128
qbyt_layers: 2
# The deployed QbyT score is the normalized probability of completing one
# monotonic, temporally compact path through every anchor phoneme.  Frame counts
# are measured after encoder subsampling (25 Hz for the default encoders).
qbyt_alignment:
  topology: bounded_segmental_v1
  min_phone_duration_frames: 1
  max_phone_duration_frames: 8
  max_inter_phone_gap_frames: 2
  max_keyword_span_frames: 30
  temperature: 0.2
  local_context_kernel: 5
negative_ratio: 1
learning_rate: 0.0005
warmup_steps: 2500
total_scheduler_steps: 50000
accumulate_grad_batches: 1
precision: bf16-mixed
optimizer: adam
weight_decay: 0.0
strategy: auto
find_unused_parameters: false
gradient_diagnostics:
  enabled: false
  max_steps: 5
gradient_clip_val: 1.0
log_interval: 10
val_check_interval: 1000
freeze_encoder: false

# Waveform-domain additive-noise augmentation for base Stage II QbyT training.
# Clean samples keep using the precomputed fbank cache; only samples selected by
# probability load a cached/raw waveform, mix one noise recording at a random
# SNR, and recompute fbank with the shared top-level `fbank` settings. Validation
# and evaluation are always clean. Generate a waveform cache during paper prep
# with `prep.waveform_dir=...`, or point waveform_dir at an equivalent WAV tree.
noise_augmentation:
  enabled: false
  probability: 0.3
  waveform_dir: ""
  # One audio path per line. Relative entries resolve from this file's parent.
  noise_list_path: ""
  snr_db_min: 10.0
  snr_db_max: 20.0

# Prefix targets supervise partial progress; the final full-keyword path is
# supervised only by the utterance objective.
sequence_loss:
  target_mode: ordered_contiguous_prefix
  progress_weight: 0.3
  normalization: sample

# Phoneme-CTC trunk between the frozen encoder and QbyT (see configs/phoneme_adapter).
# Off by default so pre-adapter checkpoints keep loading and stay comparable.
phoneme_adapter:
  enabled: false
  init_checkpoint: ""
  freeze: false
  ctc_weight: 0.0
  ctc_dropout: 0.0
  expose_posterior: false
  trunk:
    type: conv
    output_dim: 192
    num_layers: 2
    kernel_size: 7
    dropout: 0.1

checkpoint_dir: ${paths.exp_root}/stage2_qbyt/checkpoints
log_dir: ${paths.exp_root}/stage2_qbyt/logs
run_name: stage2_qbyt

dataloader:
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

ema:
  enabled: false
  decay: 0.999
  start_step: 0

console:
  rich: true
  device_stats: false
  throughput: false
  refresh_rate: null
  leave: true

logging:
  backends: [csv, tensorboard]
  grad_norm: true
  wandb:
    project: dma-kws
    mode: online
  trackio:
    project: dma-kws

validation:
  batch_size: 256
  val_check_interval: 1000
  # Fixed-width bins for validation score calibration diagnostics.
  ece_num_bins: 15

eval:
  fbank:
    dither: 0.0
  split: hard
  aggregate_csv: evaluation_set/test_all_phrase.csv
  batch_size: 256

checkpoint:
  every_n_train_steps: 1000
  save_top_k: -1
  monitor: val_auc
  mode: max
