manifest: ""
output_dir: outputs/eval_two_stage_kws
stage2_clip_output_dir: outputs/eval_stage2_clips
# Generate ROC/DET PNGs when the manifest contains both positive and negative labels.
plot_curves: true
plot_dpi: 160
# Optional ROC/DET guide: rates use [0, 1]; configure at most one bound.
plot_min_recall: null
plot_max_fpr: null
per_output_dir: outputs/eval_phoneme_adapter_per
# PER reads the text actually spoken in each clip from this manifest column.
# For legacy KWS-only manifests, keyword is allowed only with per_label_filter=1.
per_reference_column: text_variant
per_label_filter: null
limit: 0
input_format: librispeech-dir
parquet_root: ""
parquet_split: ""
parquet_audio_dir: ""
dev_parquet_root: ""
dev_parquet_split: ""
dev_parquet_audio_dir: ""
input_parquet: ""
decoded_parquet_root: ""
dataset_root: ""
output_subdir: ""
limit_anchors: 0
# Force regenerating the parquet ngram_g2p column with g2p_en. Stage II prep does
# this automatically when the column has no stress markers (legacy data).
force_g2p_recompute: false
num_workers: 0
use_rich: true
train_manifest: ""
dev_manifest: ""
fbank_root: ""
audio_root: ""
no_skip_existing: false
test_dir: ""
from_csv: false
log_interval: 1000
checkpoint: ""
split: hard
batch_size: 0
input_dir: ""
pattern: "*.ckpt"
last_k: 10
output: ""
stage1_ckpt: ""
stage2_ckpt: ""
musan_root: ""
# Optional in-memory interference for eval_stage2_clips.py. Noise/music SNR is
# the clean/interference RMS ratio. Speech relative_db is speech RMS relative
# to clean: negative is quieter, zero is equal, and positive is louder.
# Stationary noise is synthetic and volume variation is source-free; bursts use
# files from MUSAN/noise and therefore require prep.musan_root when enabled.
musan_mix:
  seed: 2025
  noise:
    enabled: false
    snr_db: 20.0
  music:
    enabled: false
    snr_db: 20.0
  speech:
    enabled: false
    relative_db: 0.0
  stationary_noise:
    enabled: false
    kind: white_gaussian
    snr_db: 20.0
  burst_noise:
    enabled: false
    snr_db: 10.0
    snr_scope: active_event
    event_count_min: 1
    event_count_max: 1
    duration_ms_min: 100.0
    duration_ms_max: 400.0
    fade_ms: 10.0
    allow_overlap: false
    min_gap_ms: 50.0
  volume_variation:
    enabled: false
    low_gain_db: -12.0
    high_gain_db: 6.0
    segment_ms_min: 250.0
    segment_ms_max: 750.0
    transition_ms: 50.0
# Deterministic in-memory waveform augmentations compatible with the methods in
# audio_aug commit 58410f27. Enabling any transform activates the pipeline.
audio_aug:
  seed: 2025
  speed_length_policy: variable
  pcm_policy: clip_round_each_stage
  allow_signal_mimic_overlap: false
  transforms:
    volume_gain:
      enabled: false
      gain_db: 3.0
    speed_change:
      enabled: false
      speed_factor: 1.05
    noise_mix:
      enabled: false
      snr_db: 30.0
      snr_mode: exact_rms
    subband_eq:
      enabled: false
      low_min_gain_db: -3.0
      high_min_gain_db: -5.0
    band_limit:
      enabled: false
      mode: iir
      cutoff_hz: 6500.0
      filter_order: 4
      target_sample_rate: 8000
    narrowband:
      enabled: false
      target_sample_rate: 12000
    spectral_mask:
      enabled: false
      frequency_masks: 1
      time_masks: 0
      min_gain: 0.6
      max_gain: 0.9
    amp_distortion:
      enabled: false
      distortion_type: gain_db
      rate: 0.25
      gain_db: 3.0
      max_db: -0.03
      mask_number: 4
      a: 1.0
      m: 1
      n: 1
    signal_mimic:
      enabled: false
      subband_probability: 0.6
      mute_probability: 0.0
      band_limit_probability: 0.0
      spectral_mask_probability: 0.0
      narrowband_probability: 0.0
window_sec: 3.0
hop_sec: 1.0
audio: ""
keyword: ""
keyword_phonemes: ""
keyword_mode: single
keywords: []
keyword_labels: {}
skip_unmatched: true
match_casefold: true
recursive: true
manifest_format: auto
label: ""

recompute_distances:
  input_parquet: ""
  output_parquet: ""
  top_k: 100
  block_size: 1000
  workers: -1
  # Hard-negative ranking compares phone identity, so AH0/AH1/AH2 collapse here
  # even though the model itself is trained on stress-marked symbols.
  strip_stress: true
