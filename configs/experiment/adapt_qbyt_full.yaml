# @package _global_
# Compose after the checkpoint architecture and, for joint data, adapt_joint:
#   '+experiment=[icefall_zipformer_stage2_eps_softmin_v41,adapt_joint,adapt_qbyt_full]'
# Initialize from a full Stage II model or a merged LoRA stage2_adapted.pt.
# This starts a new optimizer; resume the full run with run.resume_from instead.
adapt:
  method: qbyt_full
  # Select method-specific output paths and avoid inherited LoRA sweep results.
  exp_root: ""
  params_file: ""
  lr: null
  learning_rate: 3.0e-5
  warmup_steps: 100
  max_steps: 1000
  validation:
    # Training microbatches per rank; must be divisible by gradient accumulation.
    val_check_interval: 100
  sweep:
    enabled: false
    storage: ""
    study_name: ""
