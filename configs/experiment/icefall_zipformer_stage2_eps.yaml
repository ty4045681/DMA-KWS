# @package _global_
# Frozen Zipformer Stage II with an EPS/shared-position final readout.
#
# Usage:
#   python scripts/train_stage2_qbyt.py +experiment=icefall_zipformer_stage2_eps \
#     stage2.freeze_encoder=true

defaults:
  - icefall_zipformer_stage2
  - _self_

training:
  recipe: icefall-zipformer-frozen-eps

stage2:
  qbyt_readout:
    mode: eps_mean
  # This ablation changes only the final readout; keep the phoneme adapter out.
  phoneme_adapter:
    enabled: false
    ctc_weight: 0.0
  checkpoint_dir: ${paths.exp_root}/stage2_qbyt/checkpoints/icefall-zipformer-frozen-eps
  log_dir: ${paths.exp_root}/stage2_qbyt/logs/icefall-zipformer-frozen-eps
  run_name: icefall-zipformer-frozen-eps
