# @package _global_
# Paper-original v1 (SI) QbyT: finetune on LS+GigaPhrase-1460 (155k anchors).
#
# Mirrors the author's train/two_stage/train_2.py + train_2_2ft.py: initialize
# from the v1 init average, hard_negative_ratio 100, 100k steps, cosine warmup
# 2500. The encoder stays trainable: the released 155k-v2-ft checkpoint's
# optimizer covers all 267 model tensors, so the paper fine-tune is not the
# frozen variant (that is v1_frozen_wenet_encoder.yaml).
defaults:
  - override /paths: default

tokenizer:
  dict_path: data/dict/lang_char_v1_73.txt

paths:
  libriphrase460_root: data/dma-kws/raw/LibriPhrase-460
  gigaphrase1000_root: data/dma-kws/raw/GigaPhrase-1000

training:
  recipe: v1-ft-ls-gs-1460

stage2:
  qbyt_readout_version: 1
  qbyt_alignment: null
  sequence_loss:
    target_mode: membership
    progress_weight: 1.0
    normalization: token
  negative_tail_loss:
    enabled: false
  background_negative:
    enabled: false
  phoneme_adapter:
    enabled: false

  prep:
    output_subdir: ls-gs-1460
  init_checkpoint: ${paths.exp_root}/stage2_qbyt/checkpoints/v1-init-ls-460/avg_10.ckpt
  parquet_file: data/dma-kws/processed/stage2_qbyt/ls-gs-1460/aggregated_segments_with_g2p_distance.parquet
  wav_dir: data/dma-kws/features/fbank
  hard_negative_ratio: 100
  sample_lens: 100000000
  batch_size_per_gpu: 512
  learning_rate: 0.0005
  warmup_steps: 2500
  total_scheduler_steps: 100000
  max_steps: 100000
  num_workers: 16
  accumulate_grad_batches: 2
  strategy: ddp
  precision: 32-true
  gradient_clip_val: 1.0
  freeze_encoder: false
  checkpoint_dir: ${paths.exp_root}/stage2_qbyt/checkpoints/v1-ft-ls-gs-1460
  log_dir: ${paths.exp_root}/stage2_qbyt/logs/v1-ft-ls-gs-1460
  run_name: v1-ft-ls-gs-1460
  eval:
    split: hard
    test_dir: data/dma-kws/raw/LibriPhrase-460/eval
    batch_size: 256
