# @package _global_
defaults:
  - override /paths: default

paths:
  libriphrase460_root: data/dma-kws/raw/LibriPhrase-460

training:
  recipe: init-ls-460

stage1:
  train_splits:
    - train-clean-460
  dev_splits:
    - dev-clean
  batch_size_per_gpu: 48
  max_epochs: 30
  max_train_steps: 0
  num_workers: 4
  learning_rate: 0.001
  warmup_steps: 2500
  total_scheduler_steps: 50000
  checkpoint_avg:
    enabled: true
    last_k: 10

stage2:
  parquet_file: data/dma-kws/processed/stage2_qbyt/aggregated_segments_with_g2p_distance.parquet
  wav_dir: data/dma-kws/features/fbank
  hard_negative_ratio: 1
  sample_lens: 100000000
  batch_size_per_gpu: 512
  max_steps: 50000
  num_workers: 16
  accumulate_grad_batches: 2
  strategy: ddp
  checkpoint_dir: ${paths.exp_root}/stage2_qbyt/checkpoints/init-ls-460
  log_dir: ${paths.exp_root}/stage2_qbyt/logs/init-ls-460
  run_name: init-ls-460
  eval:
    test_dir: data/dma-kws/raw/LibriPhrase-460/eval
    batch_size: 256
