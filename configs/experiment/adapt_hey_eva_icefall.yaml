# @package _global_
# Combined LoRA continual adaptation experiment for "hey eva" on Icefall Zipformer frozen.
#
# This file is the single control panel for the "hey eva" adaptation and sweep:
# every knob that matters is spelled out below instead of being inherited
# silently from configs/adapt/default.yaml or configs/stage2/default.yaml.
#
# Usage:
#   python scripts/sweep_adapt_lora.py +experiment=adapt_hey_eva_icefall
#   python scripts/run_keyword_adaptation.py +experiment=adapt_hey_eva_icefall adapt.stage=train
#
# CLI overrides still win over everything here.

defaults:
  - icefall_zipformer_stage2_alignment
  - _self_

paths:
  libriphrase100_root: data/dma-kws/raw/LibriPhrase-100

prep:
  # A freshly trained v6 checkpoint is mandatory; every v5 readout is rejected.
  stage2_ckpt: ${oc.env:QBYT_V6_BASE_CHECKPOINT,""}

run:
  device: cuda
  devices: 1
  # Keep at 0 for sweeps: a non-zero value pins every trial to the same step
  # budget and makes adapt.sweep's max_steps dimension meaningless.
  limit_steps: 0

adapt:
  keyword: hey eva
  data_root: data/dma-kws/adapt
  exp_root: data/dma-kws/exp/lora

  # --- LoRA capacity (the sweep overrides rank/alpha per trial) ---
  rank: 8
  alpha: 16
  # Adapt the two projections that construct the local phone/frame similarity
  # matrix while keeping the shared encoder projection fixed.
  lora_targets:
    - audio_key.weight
    - text_query.weight

  # --- optimization (the sweep overrides learning_rate/max_steps per trial) ---
  learning_rate: 4.0e-4
  optimizer: adam
  weight_decay: 0.0
  warmup_steps: 100
  max_steps: 2000

  # --- data mixing ---
  # mix_ratio is the keyword:LibriPhrase ratio, i.e. the main knob trading new
  # keyword accuracy against forgetting.
  mix_ratio: 0.5
  # Virtual epoch length: sample_lens / batch_size = batches per epoch (1000
  # here). It also bounds how many LibriPhrase anchors the replay stream can
  # reach, so keep it well above a few thousand.
  sample_lens: 64000
  batch_size_per_gpu: 64
  val_batch_size: 128
  # Data loading is not the bottleneck here (64-sample batches, ~15 it/s), while each
  # worker costs file descriptors that accumulate across sweep trials in one process.
  num_workers: 8
  val_num_workers: 2

  validation:
    # Counted in train batches/rank, across virtual epoch boundaries. Divide by
    # accumulate_grad_batches for the approximate optimizer-step interval.
    val_check_interval: 1000
    # The LibriPhrase val split has ~270k pairs; in-loop validation is only for
    # the curves, sweep scoring is computed separately after training.
    limit_val_batches: 50

  sweep:
    # Target number of successfully completed trials in durable study storage;
    # reruns only fill the remaining quota.
    n_trials: 10
    # score = target_auc - lambda_forget * max(0, lph_auc_base - lph_auc_adapted)
    lambda_forget: 1.0
    # Random (seeded) subset of the LibriPhrase eval set used for the forgetting
    # term; below ~5k the AUC noise starts to dominate trial differences.
    lph_subset: 5000
    search_mix: true
    # true = TTS phase only. Re-validate the winning params on the real
    # recordings before shipping them.
    single_phase: true
    study_name: ""
    storage: ""

stage2:
  precision: bf16-mixed
  gradient_diagnostics:
    enabled: false

  # Must exactly match the v6 base checkpoint. These bounds are in post-encoder
  # frames (25 Hz): phones are 40--320 ms, adjacent phones may be separated by
  # at most 120 ms, and the whole wake phrase must fit within 1.2 s.
  qbyt_alignment:
    topology: keyword_filler_segmental_crf_v1
    min_phone_duration_frames: 1
    max_phone_duration_frames: 8
    max_inter_phone_gap_frames: 3
    max_keyword_span_frames: 30
    local_context_kernel: 5
    weakest_phone_temperature: 0.2
    weakest_phone_weight: 1.0

  # Intermediate prefixes teach progress; the final legal path is trained once
  # by the utterance BCE and is not duplicated here.
  sequence_loss:
    target_mode: ordered_contiguous_prefix
    progress_weight: 0.3
    normalization: sample

  # Keep pressure on the highest-scoring replay negatives throughout LoRA;
  # this is the part of the batch that controls low-FA deployment.
  negative_tail_loss:
    enabled: true
    weight: 0.5
    fraction: 0.1

  # Enable this with a training-only background list. Do not point it at the
  # MUSAN files reserved for final FA evaluation.
  background_negative:
    enabled: false
    probability: 0.25
    audio_list_path: ""
    duration_seconds_min: 1.0
    duration_seconds_max: 3.0

  # If the base checkpoint was trained with the phoneme adapter, set enabled=true
  # and mirror the trunk shape here. The trunk stays frozen with no auxiliary CTC
  # during adaptation: it is part of the forward pass Stage I and Stage II share,
  # so letting LoRA move it would break the single-encoder-pass premise.
  phoneme_adapter:
    enabled: false
    freeze: true
    ctc_weight: 0.0

  # Adaptation writes its own adapter/merged weights at the end of each phase,
  # so Lightning checkpoints are only a crash-safety net here.
  checkpoint:
    every_n_train_steps: 1000
    save_top_k: 1

  eval:
    test_dir: data/dma-kws/raw/LibriPhrase-100/eval
    split: hard
    batch_size: 256
    num_workers: 8
