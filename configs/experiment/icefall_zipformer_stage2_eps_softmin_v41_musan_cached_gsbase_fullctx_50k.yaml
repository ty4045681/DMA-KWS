# @package _global_
# v4.1 (`eps_softmin` + sink token + learned text / relative-bias audio positions) QbyT + MUSAN background + the GigaSpeech KWS **base** checkpoint
# (gigaspeech-20240219/exp/pretrained.pt, NOT exp-finetune) run in full-context
# (non-streaming) mode.
#
# Why chunk_size = -1 and not causal: false: the base KWS checkpoint is a causal
# (streaming) training run - its encoder tensors contain the ChunkCausalDepthwiseConv1d
# branch (24 causal_conv + 36 chunkwise keys). stage1.causal must keep matching it,
# because causal=false swaps that module for a plain nn.Conv1d and the weights stop
# loading. icefall's supported non-streaming point for a causal model is chunk_size = -1 /
# left_context_frames = -1: Zipformer2.get_chunk_info() then returns (-1, -1) (no chunk
# mask, full left context) and ChunkCausalDepthwiseConv1d treats the whole sequence as one
# chunk (if chunk_size < 0: chunk_size = seq_len).
#
# Verified against the checkpoint: encoder_embed 16/16 and encoder 311/311 tensors load
# with missing=0 unexpected=0; resolved policy "eval=-1/-1 train=match (-1/-1)"; forward
# (1,200,80) -> (1,48,128).
#
# Everything else matches the *_gs_50k runs: LS-GS-1460 data, MUSAN fbank cache at 0.25,
# 50,000 steps, batch 128, 16-mixed, frozen encoder, validation every 2500 steps.
defaults:
  - icefall_zipformer_stage2_eps_softmin_v41_musan_cached_gs_50k
  - _self_

stage1:
  stream:
    chunk_size: -1
    left_context_frames: -1

stage2:
  init_checkpoint: ${oc.env:GS_BASE_CHECKPOINT,data/dma-kws/raw/kws-checkpoints/gigaspeech-20240219/exp/pretrained.pt}
  checkpoint_dir: ${paths.exp_root}/stage2_qbyt/checkpoints/v41-musan-gsbase-fullctx-50k
  log_dir: ${paths.exp_root}/stage2_qbyt/logs/v41-musan-gsbase-fullctx-50k
  run_name: v41-musan-gsbase-fullctx-50k
