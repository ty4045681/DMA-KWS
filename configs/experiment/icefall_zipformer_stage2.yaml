# @package _global_
# Stage II training with Icefall Zipformer2 encoder (frozen)
#
# Usage:
#   export ICEFALL_ROOT=/path/to/icefall
#   export ICEFALL_CHECKPOINT=/path/to/icefall_checkpoint.pt
#   python scripts/train_stage2_qbyt.py +experiment=icefall_zipformer_stage2 \
#     run.freeze_encoder=true
#
# This config:
# - Uses icefall Zipformer2 encoder as Stage II encoder (instead of Wenet Conformer)
# - Freezes encoder, trains only QbyT verifier head (~500k params vs 10M+ for full model)
# - Trains on LibriPhrase-100 (demo) or -460 (paper scale)
# - Loads icefall checkpoint from ICEFALL_CHECKPOINT env var

defaults:
  - override /paths: default
  - override /fbank: icefall_kws
  - override /stage1: icefall_zipformer

paths:
  libriphrase100_root: data/dma-kws/raw/LibriPhrase-100

training:
  recipe: icefall-zipformer-frozen

stage1:
  # All params inherited from icefall_zipformer.yaml config above
  causal: true
  # Deployment operating point, shared by Stage I streaming decode and Stage II.
  # Units: frames at 50 Hz. 16 -> 320 ms chunk, 64 -> 1.28 s left context.
  # Override per run, e.g. stage1.stream.chunk_size=32 stage1.stream.left_context_frames=128,
  # or stage1.stream.chunk_size=-1 stage1.stream.left_context_frames=-1 for offline full context.
  stream:
    chunk_size: 16
    left_context_frames: 64

stage2:
  # Encoder output dimension = max(encoder_dim) = 128 from icefall config
  encoder_output_dim: 128
  qbyt_embed_dim: 128  # Must match encoder_output_dim for alignment
  qbyt_layers: 2

  # Load weights from icefall KWS checkpoint
  # Set via env var at runtime: export ICEFALL_CHECKPOINT=/path/to/checkpoint.pt
  init_checkpoint: ${oc.env:ICEFALL_CHECKPOINT,""}

  # Freeze encoder, train only QbyT
  freeze_encoder: true

  parquet_file: ${paths.processed_root}/stage2_qbyt/aggregated_segments_with_g2p_distance.parquet
  wav_dir: ${paths.feature_root}/fbank_icefall_kws

  # Training hyperparams (tuned for downstream QbyT training)
  negative_ratio: 1
  hard_negative_ratio: 1
  sample_lens: 5000
  batch_size_per_gpu: 128
  num_workers: 4

  learning_rate: 0.0005
  warmup_steps: 500
  total_scheduler_steps: 10000
  accumulate_grad_batches: 1
  precision: bf16-mixed
  optimizer: adam
  weight_decay: 0.0
  strategy: auto
  find_unused_parameters: true
  gradient_diagnostics:
    enabled: true
    max_steps: 5
  gradient_clip_val: 1.0

  log_interval: 10
  val_check_interval: 500

  checkpoint_dir: ${paths.exp_root}/stage2_qbyt/checkpoints/icefall-zipformer-frozen
  log_dir: ${paths.exp_root}/stage2_qbyt/logs/icefall-zipformer-frozen
  run_name: icefall-zipformer-frozen

  dataloader:
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

  logging:
    backends: [csv, tensorboard]
    wandb:
      project: dma-kws
      mode: online

  validation:
    batch_size: 128
    val_check_interval: 500

  eval:
    fbank_dir: ${paths.feature_root}/fbank_icefall_kws_eval
    # Hard is the paper's reported split and what adapt_hey_eva_icefall measures;
    # keeping training validation on easy made val/auc silently incomparable with
    # every offline eval number.
    split: hard
    batch_size: 128

  checkpoint:
    every_n_train_steps: 500
    save_top_k: 3
