# Icefall Zipformer2 KWS encoder configuration for Stage II training
# Aligned to icefall egs/gigaspeech/KWS zipformer finetune params.
# Use with: +experiment=icefall_zipformer_stage2 (sets freeze_encoder=true by default)
# 
# Requires: export ICEFALL_ROOT=/path/to/icefall
#
# Key parameters:
# - encoder_type: Must be "icefall_zipformer" for this config
# - causal: Must match the checkpoint. Flipping it swaps ChunkCausalDepthwiseConv1d
#   for a plain nn.Conv1d, so icefall weights would silently fail to load.
# - stream.*: chunked-attention operating point; see the block below
# - encoder_dim: Tuple of embedding dims per stack; output is max(encoder_dim)
# - All other params map directly to Zipformer2 constructor

encoder_type: icefall_zipformer

# Zipformer2 encoder stacks configuration
# Format: comma-separated values for each of 6 encoder stacks
num_encoder_layers: "1,1,1,1,1,1"
encoder_dim: "128,128,128,128,128,128"
encoder_unmasked_dim: "128,128,128,128,128,128"
downsampling_factor: "1,2,4,8,4,2"
feedforward_dim: "192,192,192,192,192,192"
num_heads: "4,4,4,8,4,4"
query_head_dim: "32"
value_head_dim: "12"
pos_head_dim: "4"
pos_dim: 48
cnn_module_kernel: "31,31,15,15,15,31"

# Attention and dropout
attention_dropout_rate: 0.0
dropout_rate: 0.1
use_icefall_dropout_schedule: true  # ScheduledFloat((0,0.3),(20000,0.1))

# Streaming/offline mode
causal: true

# Chunked-attention policy. Units are frames at 50 Hz (fbank 100 Hz halved by
# Conv2dSubsampling): chunk_size 16 -> 320 ms, left_context_frames 64 -> 1.28 s.
#
# `chunk_size` / `left_context_frames` are the DEPLOYMENT operating point. They
# must be single values and are used by validation, offline eval and inference —
# never randomized. This group deliberately leaves them undeclared so the point
# is owned by the experiment overlay (see configs/experiment/*.yaml); resolving a
# config without them raises.
#
# `train_policy` controls training only:
#   match — train at the deployment point (default; best matched accuracy)
#   multi — randomize over the lists below (icefall's multi-latency recipe,
#           i.e. the `--chunk-size 16,32,64,-1` used by egs/gigaspeech/KWS)
stream:
  train_policy: match
  train_chunk_size: "16,32,64,-1"
  train_left_context_frames: "64,128,256,-1"

# Warmup batches for icefall scheduler
warmup_batches: 4000.0

# Input feature dimension (fixed at 80 for fbank)
input_dim: 80

# These fields are ignored for icefall encoder (present for config consistency)
attention_heads: 4
linear_units: 576
num_blocks: 6
positional_dropout_rate: 0.1
cnn_module_norm: batch_norm
use_dynamic_chunk: false
use_dynamic_left_chunk: false
gradient_checkpointing: false
cmvn: null
