# Hey Google corpus plan for scripts/generate_hey_eva_tts.py.
#
# Same shape as configs/tts/hey_eva.yaml: the word table carries the ARPAbet
# phones (the manifest's source of truth) plus the IPA spelling each engine
# needs. IPA strings come from espeak-ng itself, so Piper reads its own
# alphabet.
run_root: outputs/tts/hey_google

keyword: hey google

words:
  hey: {phones: [HH, EY1], ipa: "hˈeɪ"}
  # The bare "Google" phrase would be rewritten end to end by the phoneme
  # rules, so it switches to the alias dictionary. "Googal" is the respelling
  # espeak-ng maps to ɡˈuːɡəl, the same phones as Google.
  google: {phones: [G, UW1, G, AH0, L], ipa: "ɡˈuːɡəl", say_as: "Googal"}
  goggle: {phones: [G, AA1, G, AH0, L], ipa: "ɡˈɑːɡəl"}
  gaggle: {phones: [G, AE1, G, AH0, L], ipa: "ɡˈæɡəl"}
  giggle: {phones: [G, IH1, G, AH0, L], ipa: "ɡˈɪɡəl"}
  gurgle: {phones: [G, ER1, G, AH0, L], ipa: "ɡˈɜːɡəl"}
  googles: {phones: [G, UW1, G, AH0, L, Z], ipa: "ɡˈuːɡəlz"}
  googly: {phones: [G, UW1, G, L, IY0], ipa: "ɡˈuːɡli"}
  goog: {phones: [G, UW1, G], ipa: "ɡˈuːɡ"}
  googol: {phones: [G, UW1, G, AA0, L], ipa: "ɡˈuːɡɑːl"}
  bugle: {phones: [B, Y, UW1, G, AH0, L], ipa: "bjˈuːɡəl"}
  goober: {phones: [G, UW1, B, ER0], ipa: "ɡˈuːbɚ"}

phoneme_words: [google, goggle, gaggle, giggle, gurgle, googles, googly, goog, googol, bugle, goober]

# Five positives, same prosody family as Hey Eva: punctuation only.
phrases:
  - {text: "Hey Google", label: 1}
  - {text: "Hey, Google", label: 1}
  - {text: "Hey Google.", label: 1}
  - {text: "Hey Google!", label: 1}
  - {text: "Hey! Google", label: 1}
  # Vowel change in the stressed syllable.
  - {text: "Hey Goggle", label: 0}
  - {text: "Hey Gaggle", label: 0}
  - {text: "Hey Giggle", label: 0}
  - {text: "Hey Gurgle", label: 0}
  # Coda and syllable changes.
  - {text: "Hey Googles", label: 0}
  - {text: "Hey Googly", label: 0}
  # Truncations.
  - {text: "Hey Goog", label: 0}
  - {text: "Google", label: 0}
  - {text: "Hey", label: 0}
  # Different word, same neighbourhood.
  - {text: "Hey Googol", label: 0}
  - {text: "Hey Bugle", label: 0}
  - {text: "Hey Goober", label: 0}

providers:
  elevenlabs:
    alias: elevenlabs
    model_id: eleven_v3
    output_format: wav_16000
    dictionary_name: hey-google-corpus
    dictionary_alphabet: ipa
    api_key_env: ELEVENLABS_API_KEY
    voice_settings:
      stability: 0.5
      similarity_boost: 0.75
    speeds: [0.9, 1.0, 1.1]
    voices:
