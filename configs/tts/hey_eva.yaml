      - {voice_id: en_GB-alba-medium, name: Alba, accent: scottish, gender: female}

  kokoro:
    alias: kokoro
    lang_code: a
    # Kokoro takes speed only. It has no loudness and no pitch control, so its
    # clips carry no volume axis.
    speeds: [0.9, 1.0, 1.1]
    voices:
      - {voice_id: af_bella, name: Bella, gender: female}
      - {voice_id: af_heart, name: Heart, gender: female}
      - {voice_id: af_nicole, name: Nicole, gender: female}
