paths:
  librispeech_root: data/dma-kws/raw/LibriSpeech
  libriphrase460_root: data/dma-kws/raw/LibriPhrase-460
  processed_root: data/dma-kws/processed
  feature_root: data/dma-kws/features
  exp_root: data/dma-kws/exp

tokenizer:
  dict_path: data/dict/lang_char.txt
  split_with_space: " "

training:
  seed: 2025
  recipe: init-ls-460

stage1:
  train_splits:
    - train-clean-460
  dev_splits:
    - dev-clean
  sample_rate: 16000
  input_dim: 80
  encoder_output_dim: 144
  attention_heads: 4
  linear_units: 576
  num_blocks: 6
  batch_size_per_gpu: 48
  max_epochs: 30
  max_train_steps: 0
  num_workers: 4
  learning_rate: 0.001
  warmup_steps: 2500
  total_scheduler_steps: 50000
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.0
  ctc_dropout: 0.0
  cnn_module_kernel: 3
  gradient_clip_val: 1.0
  log_interval: 10
  checkpoint_dir: data/dma-kws/exp/stage1_phoneme_ctc/checkpoints
  log_dir: data/dma-kws/exp/stage1_phoneme_ctc/logs
  run_name: stage1_phoneme_ctc
  checkpoint_avg:
    enabled: true
    last_k: 10
    pattern: "*.ckpt"
    output_name: avg_10.ckpt
  validation:
    dev_manifest: ""
    batch_size: 48
    check_val_every_n_epoch: 1
    num_decode_batches: 0

stage2:
  encoder_output_dim: 144
  qbyt_embed_dim: 128
  qbyt_layers: 2
  parquet_file: data/dma-kws/processed/stage2_qbyt/aggregated_segments_with_g2p_distance.parquet
  wav_dir: data/dma-kws/features/fbank
  negative_ratio: 1
  hard_negative_ratio: 1
  sample_lens: 100000000
  batch_size_per_gpu: 512
  max_steps: 50000
  num_workers: 16
  learning_rate: 0.0005
  warmup_steps: 2500
  total_scheduler_steps: 50000
  accumulate_grad_batches: 2
  strategy: ddp
  gradient_clip_val: 1.0
  log_interval: 10
  val_check_interval: 1000
  freeze_encoder: false
  checkpoint_dir: data/dma-kws/exp/stage2_qbyt/checkpoints/init-ls-460
  log_dir: data/dma-kws/exp/stage2_qbyt/logs/init-ls-460
  run_name: init-ls-460
  validation:
    batch_size: 256
    val_check_interval: 1000
  eval:
    test_dir: data/dma-kws/raw/LibriPhrase-460/eval
    split: hard
    aggregate_csv: evaluation_set/test_all_phrase.csv
    batch_size: 256
  checkpoint:
    every_n_train_steps: 1000
    save_top_k: -1

demo:
  stage1_candidate_margin_sec: 0.15
  qbyt_threshold: 0.5
