[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dma-kws"
version = "0.1.0"
description = "DMA-KWS: Dual-stage Matching keyword spotting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "hydra-core>=1.3",
    "g2p_en>=2.1.0",
    "numpy",
    "scipy>=1.15",
    "matplotlib>=3.8",
    "pandas",
    "pyarrow",
    "soundfile",
    "tqdm",
    "pytorch-lightning>=2.5",
    "tensorboard",
    "torchmetrics",
    "transformers",
    "huggingface_hub",
    "openai-whisper",
    "rich",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
adapt = ["optuna>=3.0"]
locator = ["sherpa-onnx>=1.10"]
wekws = ["librosa"]
icefall = ["lhotse==1.33.0"]

[tool.setuptools.packages.find]
include = ["dma_kws*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
