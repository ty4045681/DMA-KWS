hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +experiment=v1_eval_author_si
    - ++stage2.init_checkpoint=data/dma-kws/exp/author_v1/stage2_v1_si.pt
    - ++stage2.parquet_file=data/dma-kws/processed/stage2_qbyt/v1-wenet-subset/aggregated_segments_with_g2p_distance.parquet
    - ++stage2.wav_dir=data/dma-kws/features/fbank_wenet_subset
    - ++stage2.eval.test_dir=data/dma-kws/raw/LibriPhrase-100/eval
    - ++stage2.eval.fbank_dir=data/dma-kws/features/fbank_icefall_kws_eval
    - ++stage2.freeze_encoder=true
    - ++stage2.precision=16-mixed
    - ++stage2.learning_rate=1e-4
    - ++stage2.sequence_loss.target_mode=membership
    - ++stage2.sequence_loss.progress_weight=1.0
    - ++stage2.sequence_loss.normalization=token
    - ++stage2.max_steps=5000
    - ++stage2.total_scheduler_steps=5000
    - ++stage2.num_workers=6
    - ++stage2.validation.val_check_interval=1000000
    - ++stage2.checkpoint.every_n_train_steps=1000000
    - ++stage2.run_name=v1-ft-wenet-control
    - ++stage2.checkpoint_dir=data/dma-kws/exp/stage2_qbyt/checkpoints/v1-ft-wenet-control
    - ++stage2.log_dir=data/dma-kws/exp/stage2_qbyt/logs/v1-ft-wenet-control
    - ++stage2.background_negative.enabled=false
    - run.devices=1
  job:
    name: train_stage2_qbyt
    chdir: false
    override_dirname: ++stage2.background_negative.enabled=false,++stage2.checkpoint.every_n_train_steps=1000000,++stage2.checkpoint_dir=data/dma-kws/exp/stage2_qbyt/checkpoints/v1-ft-wenet-control,++stage2.eval.fbank_dir=data/dma-kws/features/fbank_icefall_kws_eval,++stage2.eval.test_dir=data/dma-kws/raw/LibriPhrase-100/eval,++stage2.freeze_encoder=true,++stage2.init_checkpoint=data/dma-kws/exp/author_v1/stage2_v1_si.pt,++stage2.learning_rate=1e-4,++stage2.log_dir=data/dma-kws/exp/stage2_qbyt/logs/v1-ft-wenet-control,++stage2.max_steps=5000,++stage2.num_workers=6,++stage2.parquet_file=data/dma-kws/processed/stage2_qbyt/v1-wenet-subset/aggregated_segments_with_g2p_distance.parquet,++stage2.precision=16-mixed,++stage2.run_name=v1-ft-wenet-control,++stage2.sequence_loss.normalization=token,++stage2.sequence_loss.progress_weight=1.0,++stage2.sequence_loss.target_mode=membership,++stage2.total_scheduler_steps=5000,++stage2.validation.val_check_interval=1000000,++stage2.wav_dir=data/dma-kws/features/fbank_wenet_subset,+experiment=v1_eval_author_si,run.devices=1
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /home/ubuntu/dma-kws
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ubuntu/dma-kws/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ubuntu/dma-kws/outputs/2026-10-02/19-12-02
    choices:
      experiment: v1_eval_author_si
      locator: phoneme_ctc
      adapt: default
      prep: default
      run: default
      demo: default
      phoneme_adapter: default
      stage2: default
      stage1: default
      fbank: default
      training: default
      tokenizer: default
      paths: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
