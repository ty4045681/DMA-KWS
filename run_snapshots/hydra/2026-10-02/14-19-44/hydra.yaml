hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +experiment=v1_paper_ls_gs1460
    - run.device=cpu
    - run.devices=1
    - run.limit_steps=3
    - stage2.parquet_file=/tmp/v1_smoke/data/smoke.parquet
    - stage2.wav_dir=data/dma-kws/features/fbank
    - stage2.hard_negative_ratio=0
    - stage2.negative_ratio=1
    - stage2.batch_size_per_gpu=4
    - stage2.num_workers=0
    - stage2.max_steps=3
    - stage2.total_scheduler_steps=3
    - stage2.val_check_interval=3
    - stage2.eval.test_dir=/tmp/v1_smoke/eval
    - stage2.eval.batch_size=4
    - run.init_checkpoint=data/dma-kws/exp/author_v1/stage2_v1_si.pt
    - stage2.checkpoint_dir=/tmp/v1_smoke/ckpt
    - stage2.log_dir=/tmp/v1_smoke/logs
  job:
    name: train_stage2_qbyt
    chdir: false
    override_dirname: +experiment=v1_paper_ls_gs1460,run.device=cpu,run.devices=1,run.init_checkpoint=data/dma-kws/exp/author_v1/stage2_v1_si.pt,run.limit_steps=3,stage2.batch_size_per_gpu=4,stage2.checkpoint_dir=/tmp/v1_smoke/ckpt,stage2.eval.batch_size=4,stage2.eval.test_dir=/tmp/v1_smoke/eval,stage2.hard_negative_ratio=0,stage2.log_dir=/tmp/v1_smoke/logs,stage2.max_steps=3,stage2.negative_ratio=1,stage2.num_workers=0,stage2.parquet_file=/tmp/v1_smoke/data/smoke.parquet,stage2.total_scheduler_steps=3,stage2.val_check_interval=3,stage2.wav_dir=data/dma-kws/features/fbank
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /home/ubuntu/dma-kws
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ubuntu/dma-kws/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ubuntu/dma-kws/outputs/2026-10-02/14-19-44
    choices:
      experiment: v1_paper_ls_gs1460
      locator: phoneme_ctc
      adapt: default
      prep: default
      run: default
      demo: default
      phoneme_adapter: default
      stage2: default
      stage1: default
      fbank: default
      training: default
      tokenizer: default
      paths: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
