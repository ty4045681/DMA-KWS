  num_workers: 6
  use_rich: true
  train_manifest: ''
  dev_manifest: ''
  fbank_root: ''
  audio_root: ''
  waveform_dir: ''
  no_skip_existing: false
  test_dir: ''
  from_csv: false
  log_interval: 1000
  checkpoint: ''
  split: hard
  batch_size: 64
  input_dir: ''
  pattern: '*.ckpt'
  last_k: 10
  output: ''
  stage1_ckpt: ''
  stage2_ckpt: data/dma-kws/exp/stage2_qbyt/sinkhead_stage2/SS-gsbase-stream/checkpoints/SS-gsbase-stream/version_0/stage2_step003000_sinkfit.pt
  stage2_calibration: ''
  audio_export:
    mode: disabled
    count: 5
    seed: 2025
  musan_root: data/dma-kws/raw/musan
  musan_audio_list_path: data/dma-kws/processed/musan_split/eval_musan.list
  musan_mix:
    seed: 2025
