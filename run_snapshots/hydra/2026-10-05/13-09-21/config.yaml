    speed_length_policy: variable
    pcm_policy: clip_round_each_stage
    allow_signal_mimic_overlap: false
    transforms:
      volume_gain:
        enabled: false
        gain_db: 3.0
      speed_change:
        enabled: false
        speed_factor: 1.05
      noise_mix:
        enabled: false
        snr_db: 30.0
        snr_mode: exact_rms
      subband_eq:
        enabled: false
        low_min_gain_db: -3.0
        high_min_gain_db: -5.0
      band_limit:
        enabled: false
        mode: iir
        cutoff_hz: 6500.0
        filter_order: 4
        target_sample_rate: 8000
      narrowband:
        enabled: false
