        mute_probability: 0.0
        band_limit_probability: 0.0
        spectral_mask_probability: 0.0
        narrowband_probability: 0.0
  window_sec: 1.0
  hop_sec: 1.0
  amp: fp16
  fbank_windows: independent
  num_shards: 1
