paths:
  librispeech_root: data/dma-kws/raw/LibriSpeech
  processed_root: data/dma-kws/processed
  feature_root: data/dma-kws/features
  exp_root: data/dma-kws/exp
  libriphrase100_root: data/dma-kws/raw/LibriPhrase-100
tokenizer:
  dict_path: data/dict/lang_char.txt
  split_with_space: ' '
training:
  seed: 2025
  recipe: icefall-zipformer-frozen-eps-softmin-v41
fbank:
  num_mel_bins: 80
  frame_length: 25
  frame_shift: 10
  dither: 0.0
  window_type: povey
  backend: lhotse_fbank
  target_sample_rate: 16000
  snip_edges: false
  low_freq: 20.0
  high_freq: -400.0
stage1:
  encoder_type: icefall_zipformer
  num_encoder_layers: 1,1,1,1,1,1
  encoder_dim: 128,128,128,128,128,128
  encoder_unmasked_dim: 128,128,128,128,128,128
  downsampling_factor: 1,2,4,8,4,2
  feedforward_dim: 192,192,192,192,192,192
  num_heads: 4,4,4,8,4,4
  query_head_dim: '32'
  value_head_dim: '12'
  pos_head_dim: '4'
  pos_dim: 48
  cnn_module_kernel: 31,31,15,15,15,31
  attention_dropout_rate: 0.0
  dropout_rate: 0.1
  use_icefall_dropout_schedule: true
  causal: true
  stream:
    train_policy: match
    train_chunk_size: 16,32,64,-1
    train_left_context_frames: 64,128,256,-1
    chunk_size: 16
    left_context_frames: 64
  warmup_batches: 4000.0
  input_dim: 80
  attention_heads: 4
  linear_units: 576
  num_blocks: 6
  positional_dropout_rate: 0.1
  cnn_module_norm: batch_norm
  use_dynamic_chunk: false
  use_dynamic_left_chunk: false
  gradient_checkpointing: false
  cmvn: null
stage2:
  encoder_output_dim: 128
  qbyt_embed_dim: 128
  qbyt_layers: 2
  qbyt_readout_version: 4
  qbyt_alignment:
    topology: keyword_filler_segmental_crf_v1
    min_phone_duration_frames: 1
    max_phone_duration_frames: 8
    max_inter_phone_gap_frames: 3
    max_keyword_span_frames: 30
    local_context_kernel: 5
    weakest_phone_temperature: 0.2
    weakest_phone_weight: 1.0
  negative_ratio: 1
  learning_rate: 0.0005
  warmup_steps: 500
  total_scheduler_steps: 50000
  accumulate_grad_batches: 1
  precision: 16-mixed
  optimizer: adam
  weight_decay: 0.0
  strategy: auto
  find_unused_parameters: true
  gradient_diagnostics:
    enabled: true
    max_steps: 5
  gradient_clip_val: 1.0
  log_interval: 10
  val_check_interval: 2500
  freeze_encoder: true
  noise_augmentation:
    enabled: false
    probability: 0.3
    waveform_dir: ''
    noise_list_path: ''
    snr_db_min: 10.0
    snr_db_max: 20.0
  sequence_loss:
    target_mode: ordered_contiguous_prefix
    progress_weight: 0.3
    normalization: sample
  negative_tail_loss:
    enabled: true
    weight: 0.5
    fraction: 0.1
  sink_loss:
    enabled: false
    weight: 0.25
    form: bce
    temperature: 1.0
  background_negative:
    enabled: true
    probability: 0.25
    audio_list_path: ''
    duration_seconds_min: 1.0
    duration_seconds_max: 3.0
    mode: fbank_cache
    cache_manifest: ''
    max_open_shards: 8
    sources:
    - id: musan
      weight: 1.0
      manifest: ${paths.processed_root}/background/musan/recordings.jsonl
      cache_manifest: ${paths.processed_root}/background/musan/cache/manifest.json
    validation:
      enabled: false
      samples_per_source: 256
      seed: 2025
  metadata_cache:
    max_entries: 128
    max_bytes: 33554432
  phoneme_adapter:
    enabled: false
    init_checkpoint: ''
    freeze: false
    ctc_weight: 0.0
    ctc_dropout: 0.0
    expose_posterior: false
    trunk:
      type: conv
      output_dim: 192
      num_layers: 2
      kernel_size: 7
      dropout: 0.1
  checkpoint_dir: ${paths.exp_root}/stage2_qbyt/checkpoints/v41-musan-gsbase-stream-50k
  log_dir: ${paths.exp_root}/stage2_qbyt/logs/v41-musan-gsbase-stream-50k
  run_name: v41-musan-gsbase-stream-50k
  dataloader:
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  ema:
    enabled: false
    decay: 0.999
    start_step: 0
  console:
    rich: true
    device_stats: false
    throughput: false
    refresh_rate: null
    leave: true
  logging:
    backends:
    - csv
    - tensorboard
    grad_norm: true
    wandb:
      project: dma-kws
      mode: online
    trackio:
      project: dma-kws
  validation:
    batch_size: 128
    val_check_interval: 2500
    ece_num_bins: 15
  eval:
    fbank:
      dither: 0.0
    split: hard
    aggregate_csv: evaluation_set/test_all_phrase.csv
    batch_size: 128
    fbank_dir: ${paths.feature_root}/fbank_icefall_kws_eval
    num_workers: 8
  checkpoint:
    every_n_train_steps: 1000
    save_top_k: 3
    monitor: val_auc
    mode: max
  init_checkpoint: ${oc.env:GS_BASE_CHECKPOINT,data/dma-kws/raw/kws-checkpoints/gigaspeech-20240219/exp/pretrained.pt}
  parquet_file: ${paths.processed_root}/stage2_qbyt/ls-gs-1460/aggregated_segments_with_g2p_distance.parquet
  wav_dir: ${paths.feature_root}/fbank_icefall_kws
  hard_negative_ratio: 1
  sample_lens: 100000000
  batch_size_per_gpu: 128
  num_workers: 8
  max_steps: 50000
  qbyt_readout:
    mode: eps_softmin
    temperature: 1.0
    sink_token: true
    text_position: learned
    audio_position: relative_bias
    sink_readout: additive
    sink_zero_init: true
phoneme_adapter:
  trunk:
    type: conv
    output_dim: 192
    num_layers: 2
    kernel_size: 7
    dropout: 0.1
  ctc_dropout: 0.0
  expose_posterior: false
  init_checkpoint: ''
  adapter_init_checkpoint: ''
  train_manifest: ''
  dev_manifest: ''
  batch_size_per_gpu: 32
  num_workers: 4
  max_steps: 60000
  learning_rate: 0.001
  optimizer: adamw
  weight_decay: 0.01
  warmup_steps: 500
  total_scheduler_steps: 60000
  accumulate_grad_batches: 1
  precision: bf16-mixed
  strategy: auto
  find_unused_parameters: false
  gradient_clip_val: 5.0
  log_interval: 50
  val_check_interval: 2000
  checkpoint_dir: ${paths.exp_root}/phoneme_adapter/checkpoints
  log_dir: ${paths.exp_root}/phoneme_adapter/logs
  run_name: phoneme_adapter_ctc
  dataloader:
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  validation:
    val_check_interval: 2000
    num_decode_batches: 0
    batch_size: 32
  console:
    rich: true
    device_stats: false
    throughput: false
    refresh_rate: null
    leave: true
  logging:
    backends:
    - csv
    - tensorboard
    wandb:
      project: dma-kws
      mode: online
  checkpoint:
    every_n_train_steps: 2000
    save_top_k: 3
    monitor: val/per
    mode: min
demo:
  stage1_candidate_margin_sec: 0.15
  qbyt_threshold: 0.5
  min_stage2_encoder_frames: 1
run:
  device: cuda
  devices: 1
  limit_steps: 0
  resume_from: ''
  init_checkpoint: ''
  resume_checkpoint: ''
  train_manifest: ''
  dev_manifest: ''
