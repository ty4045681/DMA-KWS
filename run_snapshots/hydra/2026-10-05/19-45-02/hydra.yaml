hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +experiment=adapt_hey_eva_v42
    - prep.keyword='hey eva'
    - prep.keyword_phonemes='HH EY1 IY1 V AH0'
    - prep.musan_root=/home/ubuntu/dma-kws/data/dma-kws/raw/musan
    - prep.musan_audio_list_path=outputs/hey_eva_window_probe/musan_subset.list
    - prep.stage2_ckpt=data/dma-kws/exp/stage2_qbyt/sinkhead_stage2/SS-zh-en/checkpoints/SS-zh-en/version_0/stage2_step003000.pt
    - prep.window_sec=1.0
    - prep.hop_sec=1.0
    - prep.batch_size=64
    - prep.num_workers=4
    - prep.amp=fp16
    - prep.output_dir=outputs/hey_eva_window_probe/cells/base_musan_w1
  job:
    name: eval_musan_fa
    chdir: false
    override_dirname: +experiment=adapt_hey_eva_v42,prep.amp=fp16,prep.batch_size=64,prep.hop_sec=1.0,prep.keyword='hey
      eva',prep.keyword_phonemes='HH EY1 IY1 V AH0',prep.musan_audio_list_path=outputs/hey_eva_window_probe/musan_subset.list,prep.musan_root=/home/ubuntu/dma-kws/data/dma-kws/raw/musan,prep.num_workers=4,prep.output_dir=outputs/hey_eva_window_probe/cells/base_musan_w1,prep.stage2_ckpt=data/dma-kws/exp/stage2_qbyt/sinkhead_stage2/SS-zh-en/checkpoints/SS-zh-en/version_0/stage2_step003000.pt,prep.window_sec=1.0
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /home/ubuntu/dma-kws
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ubuntu/dma-kws/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ubuntu/dma-kws/outputs/2026-10-05/19-45-02
    choices:
      experiment: adapt_hey_eva_v42
      locator: phoneme_ctc
      adapt: default
      prep: default
      run: default
      demo: default
      phoneme_adapter: default
      stage2: default
      stage1: icefall_zipformer
      fbank: icefall_kws
      training: default
      tokenizer: default
      paths: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
